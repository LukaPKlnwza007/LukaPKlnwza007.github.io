<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" role="img" aria-label="A traffic light beside a distance sensor sending out sonar arcs">
  <defs>
    <pattern id="tl-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#5eead4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="tl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="875" fill="#0a0e17"/>
  <rect width="1400" height="875" fill="url(#tl-grid)"/>
  <ellipse cx="900" cy="440" rx="480" ry="360" fill="url(#tl-glow)"/>

  <!-- Road, seen edge on -->
  <line x1="0" y1="720" x2="1400" y2="720" stroke="#5eead4" stroke-opacity=".22" stroke-width="2"/>
  <g stroke="#ffb454" stroke-opacity=".5" stroke-width="6" stroke-linecap="square">
    <line x1="60"  y1="790" x2="200" y2="790"/>
    <line x1="300" y1="790" x2="440" y2="790"/>
    <line x1="540" y1="790" x2="680" y2="790"/>
    <line x1="780" y1="790" x2="920" y2="790"/>
    <line x1="1020" y1="790" x2="1160" y2="790"/>
    <line x1="1260" y1="790" x2="1400" y2="790"/>
  </g>

  <!-- The light itself -->
  <g>
    <line x1="420" y1="720" x2="420" y2="470" stroke="#9fb0c9" stroke-opacity=".45" stroke-width="10"/>
    <rect x="352" y="150" width="136" height="330" rx="18"
          fill="#101728" stroke="#5eead4" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="420" cy="222" r="40" fill="#ff6b6b" fill-opacity=".22" stroke="#ff6b6b" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="420" cy="315" r="40" fill="#ffb454" fill-opacity=".22" stroke="#ffb454" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="420" cy="408" r="40" fill="#5eead4" stroke="#5eead4" stroke-width="3"/>
  </g>

  <!-- Sensor, with its arcs reaching across the crossing -->
  <g>
    <rect x="880" y="470" width="150" height="86" rx="8"
          fill="#0d1220" stroke="#ffb454" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="918" cy="513" r="26" fill="none" stroke="#ffb454" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="992" cy="513" r="26" fill="none" stroke="#ffb454" stroke-opacity=".55" stroke-width="2"/>
    <line x1="955" y1="556" x2="955" y2="720" stroke="#9fb0c9" stroke-opacity=".35" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-linecap="round">
    <path d="M850 440 A 130 130 0 0 0 850 586" stroke-opacity=".62" stroke-width="3"/>
    <path d="M800 400 A 195 195 0 0 0 800 626" stroke-opacity=".42" stroke-width="3"/>
    <path d="M750 360 A 260 260 0 0 0 750 666" stroke-opacity=".26" stroke-width="3"/>
    <path d="M700 320 A 325 325 0 0 0 700 706" stroke-opacity=".14" stroke-width="3"/>
  </g>

  <!-- Someone waiting, which is the whole point of the sensor -->
  <g stroke="#dce4f2" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="640" cy="560" r="24" stroke-opacity=".55"/>
    <line x1="640" y1="584" x2="640" y2="668"/>
    <line x1="640" y1="606" x2="600" y2="646"/>
    <line x1="640" y1="606" x2="680" y2="642"/>
    <line x1="640" y1="668" x2="612" y2="720"/>
    <line x1="640" y1="668" x2="670" y2="720"/>
  </g>

  <text x="72" y="112" fill="#ffb454" fill-opacity=".85"
        font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="30" letter-spacing="7">
    IF (distance &lt; 100) { go(); }
  </text>
</svg>
