<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" role="img" aria-label="A weekly timetable grid with one column highlighted">
  <defs>
    <pattern id="tt-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#5eead4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="tt-glow" cx="46%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="875" fill="#0a0e17"/>
  <rect width="1400" height="875" fill="url(#tt-grid)"/>
  <ellipse cx="640" cy="440" rx="560" ry="380" fill="url(#tt-glow)"/>

  <!-- Today's column, lit behind the rows -->
  <rect x="596" y="150" width="168" height="590" fill="#ffb454" fill-opacity=".1"
        stroke="#ffb454" stroke-opacity=".45" stroke-width="2"/>

  <!-- Day headers -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="26" letter-spacing="5" fill="#9fb0c9" fill-opacity=".8">
    <text x="252" y="128" text-anchor="middle">MON</text>
    <text x="420" y="128" text-anchor="middle">TUE</text>
    <text x="680" y="128" text-anchor="middle" fill="#ffb454">WED</text>
    <text x="932" y="128" text-anchor="middle">THU</text>
    <text x="1100" y="128" text-anchor="middle">FRI</text>
  </g>

  <!-- Period labels down the left -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="22" fill="#7d8da5">
    <text x="96" y="212">08:30</text>
    <text x="96" y="330">09:30</text>
    <text x="96" y="448">10:30</text>
    <text x="96" y="566">13:00</text>
    <text x="96" y="684">14:00</text>
  </g>

  <!-- Rules -->
  <g stroke="#5eead4" stroke-opacity=".18" stroke-width="1.5">
    <line x1="170" y1="150" x2="1190" y2="150"/>
    <line x1="170" y1="268" x2="1190" y2="268"/>
    <line x1="170" y1="386" x2="1190" y2="386"/>
    <line x1="170" y1="504" x2="1190" y2="504"/>
    <line x1="170" y1="622" x2="1190" y2="622"/>
    <line x1="170" y1="740" x2="1190" y2="740"/>
  </g>

  <!-- Blocks. The lit column gets solid ones, the rest are quiet. -->
  <g>
    <rect x="180" y="168" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="348" y="168" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="612" y="168" width="140" height="82" fill="#5eead4" fill-opacity=".2" stroke="#5eead4" stroke-width="2"/>
    <rect x="864" y="168" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="1032" y="168" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>

    <rect x="180" y="286" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="612" y="286" width="140" height="82" fill="#ffb454" fill-opacity=".28" stroke="#ffb454" stroke-width="2"/>
    <rect x="864" y="286" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>

    <rect x="348" y="404" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="612" y="404" width="140" height="82" fill="#5eead4" fill-opacity=".2" stroke="#5eead4" stroke-width="2"/>
    <rect x="1032" y="404" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>

    <rect x="180" y="522" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="612" y="522" width="140" height="82" fill="#5eead4" fill-opacity=".2" stroke="#5eead4" stroke-width="2"/>
    <rect x="864" y="522" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="1032" y="522" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>

    <rect x="348" y="640" width="140" height="82" fill="#101728" stroke="#5eead4" stroke-opacity=".26" stroke-width="2"/>
    <rect x="612" y="640" width="140" height="82" fill="#5eead4" fill-opacity=".2" stroke="#5eead4" stroke-width="2"/>
  </g>

  <text x="170" y="806" fill="#ffb454" fill-opacity=".85"
        font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="27" letter-spacing="6">
    which room? &#183; that one
  </text>
</svg>
