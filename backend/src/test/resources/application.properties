# Test-only settings. In-memory H2, rebuilt for every run.
spring.datasource.url=jdbc:h2:mem:contact-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Never touch a real SMTP server from a test.
contact.mail.enabled=false

# High enough that the tests do not rate-limit each other.
contact.rate-limit.max-per-window=50
contact.rate-limit.window-minutes=10
