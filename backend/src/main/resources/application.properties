# ============================================================================
# Contact API configuration
#
# Anything sensitive (SMTP password, database credentials) comes from the
# environment. Every value below uses ${VAR:default} so nothing secret has to
# be committed.
# ============================================================================

spring.application.name=portfolio-contact-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database
#
# Default is file-backed H2: runs with no setup, and survives a restart, unlike
# the in-memory variant.
#
# For production, switch to Postgres with:
#   DB_URL=jdbc:postgresql://localhost:5432/portfolio
#   DB_USER=portfolio  DB_PASSWORD=...
#   DB_DRIVER=org.postgresql.Driver
#   DDL_MODE=validate
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/contact;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_MODE:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

# H2 console for poking at data in development: http://localhost:8080/h2-console
# Always off in production (H2_CONSOLE=false).
spring.h2.console.enabled=${H2_CONSOLE:true}

# ---------------------------------------------------------------------------
# Notification email
#
# Leaving this false is fine: messages are still stored and logged, and the form
# works end to end without any SMTP setup.
# ---------------------------------------------------------------------------
contact.mail.enabled=${MAIL_ENABLED:false}
contact.mail.to=${MAIL_TO:lpk40868@loeipit.ac.th}
contact.mail.from=${MAIL_FROM:no-reply@localhost}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000

# ---------------------------------------------------------------------------
# CORS: which sites may call this API.
# The defaults cover the usual local static servers. In production set
# CORS_ORIGINS to your own domain, and only that.
# ---------------------------------------------------------------------------
contact.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://localhost:8791}

# ---------------------------------------------------------------------------
# Rate limiting: messages per IP, per window.
# ---------------------------------------------------------------------------
contact.rate-limit.max-per-window=${RATE_MAX:5}
contact.rate-limit.window-minutes=${RATE_WINDOW:10}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.dev.portfolio.contact=INFO
